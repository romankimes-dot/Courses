<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Courses</title>
  <meta name="theme-color" content="#f0eee9">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <div class="title-wrap">
      <button id="listName" class="ghost" data-a="lists" aria-label="Changer de liste">Maison</button>
      <span id="sync"></span>
    </div>
    <button id="bell" class="ghost" data-a="go" data-v="activity" aria-label="Activité" data-icon="bell"></button>
    <button id="gear" class="ghost" data-a="go" data-v="aisles" aria-label="Réglages" data-icon="settings"></button>
  </header>
  <main id="app"></main>
  <nav class="tabbar">
    <button data-tab="list" data-icon="list">Liste</button>
    <button data-tab="meals" data-icon="meals">Repas</button>
    <button data-tab="budget" data-icon="wallet">Dépenses</button>
  </nav>
  <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  <script src="src/icons.js"></script>
  <script src="src/lists.js"></script>
  <script src="src/app.js"></script>
  <script src="src/feed.js"></script>
  <script src="src/meals.js"></script>
  <script src="src/library.js"></script>
  <script src="src/money.js"></script>
  <script src="src/sheet.js"></script>
  <script src="src/trip.js"></script>
  <script src="src/sync.js"></script>
</body>
</html>
